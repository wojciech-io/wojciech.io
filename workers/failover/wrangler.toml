name            = "wojciech-io-failover"
main            = "src/index.js"
compatibility_date = "2025-05-01"

[triggers]
crons = ["*/5 * * * *"]

# Secrets (never store values here — set via: wrangler secret put <NAME>)
# Required secrets:
#   CF_ZONE_ID         — Cloudflare zone ID for wojciech.io
#   CF_API_TOKEN       — CF API token with DNS Edit scope (zone: wojciech.io)
#   CF_ROOT_RECORD_ID  — DNS record ID for the wojciech.io @ CNAME
#   AZURE_SWA_HOSTNAME — e.g. lively-beach-abc123.azurestaticapps.net
