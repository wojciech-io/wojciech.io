# Standalone Cloudflare Worker that fires the /meet booking reminders.
# CF Pages Functions can't hold a cron trigger, so this slim Worker runs every
# 15 minutes and POSTs to the Pages Function /api/cron/reminders, which does the
# real work (query D1, render the reminder email, send via Resend). Keeping the
# logic on the Pages side means it reuses the site's D1 binding + RESEND_API_KEY.
#
# Secrets (Workers → wojciech-io-meet-reminders → Settings → Variables):
#   CRON_SECRET   — shared secret; must match CRON_SECRET on the wojciech-io Pages project
# Plain var (safe to keep here):
#   MEET_URL      — base site URL the reminder endpoint lives on
#
# Deploy: cd workers/meet-reminders && npx wrangler deploy
name = "wojciech-io-meet-reminders"
main = "src/index.ts"
compatibility_date = "2026-07-04"

[triggers]
crons = ["*/15 * * * *"]

[vars]
MEET_URL = "https://wojciech.io"
