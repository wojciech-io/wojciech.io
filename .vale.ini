StylesPath = .vale/styles
MinAlertLevel = suggestion

# Pinned release, not a floating tag: `vale sync` fetches this zip in CI and the
# version is what makes two runs comparable. Bump it deliberately, and expect
# the density numbers to move when you do.
Packages = https://github.com/tbhb/vale-ai-tells/releases/download/v1.29.0/ai-tells.zip

# Parse .mdx with the markdown parser. Vale's native MDX path shells out to a
# separate `mdx2vast` binary that is not in this toolchain, and without this
# mapping every article fails with "mdx2vast not found" and reports zero hits,
# which reads as clean copy rather than as a broken linter.
[formats]
mdx = md

# English content only. Vale's ai-tells rules are written against English, and
# scripts/anti-slop.sh is what enforces that scope: it never passes a file from
# src/content/insights/pl/ to Vale, because the Polish text would be scored by
# rules that do not apply to it.
[*.{md,mdx}]
BasedOnStyles = ai-tells

# EmDashUsage conflates the em dash with the en dash, and the en dash is
# correct in numeric and date ranges (2020-2024, 15-200 people), which produced
# a wall of false positives on the CV page. The tone of voice bans the em dash
# only, and that is an exact character match, so scripts/anti-slop.sh counts it
# directly instead. Turning this rule off loses nothing and removes the noise.
ai-tells.EmDashUsage = NO
