<svg xml:lang="pl" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 185" width="420" height="185" role="img" aria-labelledby="title detail" font-family="Inter, Arial, sans-serif">
  <title id="title">Wynik i koszt Sola oraz Opusa według ustawienia</title>
  <desc id="detail">Sol Xhigh i Opus High mają po 52 punkty po zaokrągleniu. Koszt próby w indeksie to odpowiednio 0,76 i 3,46 USD.</desc>
  <rect x="0" y="0" width="420" height="185" fill="#f7f6f1"/>
  <text x="20" y="31" text-anchor="start" fill="#484c42" font-size="18" font-weight="700">Po zaokrągleniu oba mają 52 pkt</text>
  <line x1="20" y1="44" x2="400" y2="44" stroke="#cfcec4" stroke-width="1"/>
  <text x="20" y="71" text-anchor="start" fill="#171a16" font-size="23" font-weight="650">Sol Xhigh</text>
  <text x="398" y="71" text-anchor="end" fill="#171a16" font-size="26" font-weight="750">$0,76</text>
  <rect x="20" y="81" width="380" height="8" fill="#e5e4da" stroke="none" stroke-width="1"/>
  <rect x="20" y="81" width="80" height="8" fill="#ebff00" stroke="#676c5f" stroke-width="0.7"/>
  <text x="20" y="131" text-anchor="start" fill="#171a16" font-size="23" font-weight="650">Opus High</text>
  <text x="398" y="131" text-anchor="end" fill="#171a16" font-size="26" font-weight="750">$3,46</text>
  <rect x="20" y="141" width="380" height="8" fill="#e5e4da" stroke="none" stroke-width="1"/>
  <rect x="20" y="141" width="365" height="8" fill="#171a16" stroke="none" stroke-width="0"/>
  <line x1="20" y1="168" x2="400" y2="168" stroke="#cfcec4" stroke-width="1"/>
</svg>
