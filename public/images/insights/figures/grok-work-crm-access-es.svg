<svg xml:lang="es" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 281" width="420" height="281" role="img" aria-labelledby="title detail" font-family="Inter, Arial, sans-serif">
  <title id="title">Funciones de equipo de Grok Bot y ChatGPT Work</title>
  <desc id="detail">Un Grok Bot compartido puede usar la conexión del propietario o una conexión personal autorizada. La respuesta puede aparecer en un chat privado o un hilo de Slack. ChatGPT Team Tasks usa la cuenta de servicio del equipo y las conexiones configuradas. El equipo puede consultar el historial y los archivos.</desc>
  <rect x="0" y="0" width="420" height="281" fill="#f7f6f1"/>
  <text x="20" y="28" text-anchor="start" fill="#484c42" font-size="18" font-weight="750">Cuenta del CRM</text>
  <text x="227" y="28" text-anchor="start" fill="#484c42" font-size="18" font-weight="750">Dónde se ve</text>
  <line x1="20" y1="44" x2="400" y2="44" stroke="#cfcec4" stroke-width="1"/>
  <rect x="20" y="59" width="10" height="10" fill="#ebff00" stroke="#676c5f" stroke-width="0.8"/>
  <text x="40" y="71" text-anchor="start" fill="#171a16" font-size="23" font-weight="750">Grok Bot</text>
  <line x1="204" y1="87" x2="204" y2="135" stroke="#cfcec4" stroke-width="1"/>
  <text x="20" y="106" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">App del propietario</text>
  <text x="20" y="130" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">o personal autorizada</text>
  <text x="227" y="106" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">Chat privado o</text>
  <text x="227" y="130" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">hilo de Slack</text>
  <line x1="20" y1="156" x2="400" y2="156" stroke="#cfcec4" stroke-width="1"/>
  <rect x="20" y="171" width="10" height="10" fill="#171a16" stroke="none" stroke-width="0.8"/>
  <text x="40" y="183" text-anchor="start" fill="#171a16" font-size="23" font-weight="750">ChatGPT Team Task</text>
  <line x1="204" y1="199" x2="204" y2="247" stroke="#cfcec4" stroke-width="1"/>
  <text x="20" y="218" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">Cuenta del equipo</text>
  <text x="20" y="242" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">y apps configuradas</text>
  <text x="227" y="218" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">Historial del equipo</text>
  <text x="227" y="242" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">y archivos generados</text>
  <line x1="20" y1="268" x2="400" y2="268" stroke="#cfcec4" stroke-width="1"/>
</svg>
