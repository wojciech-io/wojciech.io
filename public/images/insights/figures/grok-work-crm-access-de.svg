<svg xml:lang="de" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 281" width="420" height="281" role="img" aria-labelledby="title detail" font-family="Inter, Arial, sans-serif">
  <title id="title">Teamfunktionen von Grok Bot und ChatGPT Work</title>
  <desc id="detail">Ein geteilter Grok Bot kann über die Verbindung des Besitzers oder über eine genehmigte persönliche App lesen. Antworten erscheinen im privaten Chat oder in einem Slack-Thread. ChatGPT Team Tasks nutzt das Dienstkonto und konfigurierte App-Verbindungen. Teammitglieder sehen den Verlauf und die erstellten Dateien.</desc>
  <rect x="0" y="0" width="420" height="281" fill="#f7f6f1"/>
  <text x="20" y="28" text-anchor="start" fill="#484c42" font-size="18" font-weight="750">CRM-Zugriff</text>
  <text x="227" y="28" text-anchor="start" fill="#484c42" font-size="18" font-weight="750">Empfängerkreis</text>
  <line x1="20" y1="44" x2="400" y2="44" stroke="#cfcec4" stroke-width="1"/>
  <rect x="20" y="59" width="10" height="10" fill="#ebff00" stroke="#676c5f" stroke-width="0.8"/>
  <text x="40" y="71" text-anchor="start" fill="#171a16" font-size="23" font-weight="750">Grok Bot</text>
  <line x1="204" y1="87" x2="204" y2="135" stroke="#cfcec4" stroke-width="1"/>
  <text x="20" y="106" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">App des Besitzers</text>
  <text x="20" y="130" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">oder eigene App</text>
  <text x="227" y="106" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">Privater Chat oder</text>
  <text x="227" y="130" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">Slack-Thread</text>
  <line x1="20" y1="156" x2="400" y2="156" stroke="#cfcec4" stroke-width="1"/>
  <rect x="20" y="171" width="10" height="10" fill="#171a16" stroke="none" stroke-width="0.8"/>
  <text x="40" y="183" text-anchor="start" fill="#171a16" font-size="23" font-weight="750">ChatGPT Team Task</text>
  <line x1="204" y1="199" x2="204" y2="247" stroke="#cfcec4" stroke-width="1"/>
  <text x="20" y="218" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">Dienstkonto</text>
  <text x="20" y="242" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">und App-Verbindung</text>
  <text x="227" y="218" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">Ausführungsverlauf</text>
  <text x="227" y="242" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">und erstellte Dateien</text>
  <line x1="20" y1="268" x2="400" y2="268" stroke="#cfcec4" stroke-width="1"/>
</svg>
