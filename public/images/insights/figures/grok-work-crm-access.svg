<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 281" width="420" height="281" role="img" aria-labelledby="title detail" font-family="Inter, Arial, sans-serif">
  <title id="title">CRM credentials and audience</title>
  <desc id="detail">Grok Bot can read through the owner's connection or an approved personal connection in supported contexts. The reply can appear in a private chat or a selected Slack thread. ChatGPT Team Tasks use the team's service account and configured app connections. Team members can see past runs and generated files.</desc>
  <rect x="0" y="0" width="420" height="281" fill="#f7f6f1"/>
  <text x="20" y="28" text-anchor="start" fill="#484c42" font-size="18" font-weight="750">CRM account</text>
  <text x="227" y="28" text-anchor="start" fill="#484c42" font-size="18" font-weight="750">Result is visible in</text>
  <line x1="20" y1="44" x2="400" y2="44" stroke="#cfcec4" stroke-width="1"/>
  <rect x="20" y="59" width="10" height="10" fill="#ebff00" stroke="#676c5f" stroke-width="0.8"/>
  <text x="40" y="71" text-anchor="start" fill="#171a16" font-size="23" font-weight="750">Grok Bot</text>
  <line x1="204" y1="87" x2="204" y2="135" stroke="#cfcec4" stroke-width="1"/>
  <text x="20" y="106" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">Owner's app or</text>
  <text x="20" y="130" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">approved personal app</text>
  <text x="227" y="106" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">Private chat or</text>
  <text x="227" y="130" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">selected Slack thread</text>
  <line x1="20" y1="156" x2="400" y2="156" stroke="#cfcec4" stroke-width="1"/>
  <rect x="20" y="171" width="10" height="10" fill="#171a16" stroke="none" stroke-width="0.8"/>
  <text x="40" y="183" text-anchor="start" fill="#171a16" font-size="23" font-weight="750">ChatGPT Team Task</text>
  <line x1="204" y1="199" x2="204" y2="247" stroke="#cfcec4" stroke-width="1"/>
  <text x="20" y="218" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">Team service account</text>
  <text x="20" y="242" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">and configured app</text>
  <text x="227" y="218" text-anchor="start" fill="#171a16" font-size="18" font-weight="600">Team run history</text>
  <text x="227" y="242" text-anchor="start" fill="#484c42" font-size="18" font-weight="500">and generated files</text>
  <line x1="20" y1="268" x2="400" y2="268" stroke="#cfcec4" stroke-width="1"/>
</svg>
