<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wojciech Łuszczyński Sign in</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
  (function(){
    try {
      var saved = localStorage.getItem('theme');
      var mode = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', mode);
      document.documentElement.style.colorScheme = mode;
    } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
<style>
  /* Same tokens and type roles as wojciech.io (src/styles/tokens.css,
     global.css t-*), so the private workspace reads as the same product. */
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist-Regular.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Geist'; src: url('/fonts/Geist-SemiBold.woff2') format('woff2'); font-weight: 600; font-display: swap; }
  @font-face { font-family: 'Geist Mono'; src: url('/fonts/GeistMono-Medium.woff2') format('woff2'); font-weight: 500 700; font-display: swap; }
  :root {
    --bg:#f4f3ef; --surface:#fffefb; --surface-2:#ecebe4;
    --border:#dcdbd3; --border-2:#c3c1b5;
    --text:#080808; --text-muted:#52514a; --text-dim:#67665f;
    --lime:#eaff00; --lime-hi:#dcf000; --on-lime:#080808;
    --grid:rgb(8 8 8 / 0.045);
    --radius-card:12px; --radius-btn:7px;
    --sans:'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono:'Geist Mono', ui-monospace, monospace;
  }
  [data-theme="dark"] {
    --bg:#141009; --surface:#1c1710; --surface-2:#261f15;
    --border:#2c2418; --border-2:#3c3322;
    --text:#f4f0e7; --text-muted:#b0a897; --text-dim:#999180;
    --lime:#ebff00; --lime-hi:#f5ff66; --on-lime:#141009;
    --grid:rgb(244 240 231 / 0.05);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      linear-gradient(to right, var(--grid) 1px, transparent 1px) 0 0 / 48px 48px,
      linear-gradient(to bottom, var(--grid) 1px, transparent 1px) 0 0 / 48px 48px,
      var(--bg);
    color: var(--text);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  /* role: label */
  .langbtn, .label, .role, .foot {
    font-family: var(--mono); font-size: 0.6875rem; font-weight: 600;
    letter-spacing: 0.12em; text-transform: uppercase;
  }
  .topbar { display: flex; align-items: center; justify-content: flex-end; gap: 8px; padding: 20px 24px; }
  .icon-btn {
    width: 32px; height: 32px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border-2); border-radius: var(--radius-btn); background: var(--surface);
    color: var(--text-dim); cursor: pointer; transition: color .15s, border-color .15s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--text); }
  .langtoggle { display: inline-flex; border: 1px solid var(--border-2); border-radius: var(--radius-btn); overflow: hidden; background: var(--surface); }
  .langbtn { padding: 0 10px; height: 30px; background: none; border: none; color: var(--text-dim); cursor: pointer; transition: color .15s, background .15s; }
  .langbtn + .langbtn { border-left: 1px solid var(--border); }
  .langbtn:hover { color: var(--text); }
  .langbtn.active { background: var(--lime); color: var(--on-lime); }
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 20px 48px; }
  .panel {
    width: 100%; max-width: 400px; padding: 36px 32px 28px;
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-card);
    box-shadow: 0 24px 60px -30px rgb(0 0 0 / 0.25);
  }
  .wordmark { display: inline-flex; align-items: center; margin-bottom: 28px; font-family: var(--mono); font-size: 0.8125rem; font-weight: 600; color: var(--text); }
  .wordmark span { margin-left: 2px; display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 6px; background: var(--lime); color: var(--on-lime); font-size: 8px; font-weight: 700; }
  /* role: h1 at its phone size */
  .name { font-size: 1.75rem; font-weight: 600; line-height: 1.12; letter-spacing: -0.02em; margin: 0 0 10px; }
  .role { color: var(--text-dim); margin: 0 0 28px; }
  .form { display: flex; flex-direction: column; }
  .label { color: var(--text-muted); margin: 0 0 8px; }
  .input {
    width: 100%; height: 48px; padding: 0 14px;
    background: var(--bg); border: 1px solid var(--border-2); border-radius: var(--radius-btn);
    color: var(--text); font-size: 1rem; font-family: var(--sans); outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder { color: var(--text-dim); }
  .input:focus { border-color: var(--text); box-shadow: 0 0 0 3px color-mix(in srgb, var(--lime) 45%, transparent); }
  /* role: button */
  .btn {
    width: 100%; height: 48px; margin-top: 12px;
    background: var(--lime); color: var(--on-lime);
    font-family: var(--mono); font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
    border: none; border-radius: var(--radius-btn); cursor: pointer; transition: background .15s;
  }
  .btn:hover:not(:disabled) { background: var(--lime-hi); }
  .btn:disabled { cursor: not-allowed; opacity: .55; }
  .err { min-height: 20px; margin-top: 12px; font-size: 0.875rem; color: #b42318; opacity: 0; transition: opacity .15s; }
  [data-theme="dark"] .err { color: #ff8a80; }
  .err.show { opacity: 1; }
  .foot { margin: 24px 0 0; padding-top: 18px; border-top: 1px solid var(--border); color: var(--text-dim); }
  .icon-sun { display: none; }
  .icon-moon { display: block; }
  [data-theme="dark"] .icon-sun { display: block; }
  [data-theme="dark"] .icon-moon { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="langtoggle" role="group" aria-label="Language">
    <button class="langbtn" data-lang="pl" type="button">PL</button>
    <button class="langbtn active" data-lang="en" type="button">EN</button>
    <button class="langbtn" data-lang="it" type="button">IT</button>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" type="button">
    <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</div>

<div class="stage">
  <div class="panel">
    <p class="wordmark" dir="ltr" aria-label="wojciech.io">wojciech<span aria-hidden="true">.io</span></p>
    <h1 class="name">Wojciech Łuszczyński</h1>
    <p class="role" data-i18n="role">AI-native revenue operator</p>

    <form class="form" id="loginForm" novalidate>
      <label class="label" for="pw" data-i18n="label">Password</label>
      <input class="input" id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required autofocus />
      <button class="btn" id="submitBtn" type="submit" data-i18n="submit">Enter</button>
      <div class="err" id="err" role="alert" data-i18n="err">Wrong password</div>
    </form>

    <p class="foot" data-i18n="foot">Private workspace. Access by invitation.</p>
  </div>
</div>

<script>
  // Theme toggle
  document.getElementById('themeBtn').addEventListener('click', function() {
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.documentElement.style.colorScheme = next;
    try { localStorage.setItem('theme', next); } catch(e){}
  });

  // i18n
  var I18N = {
    en: { role:'AI-native revenue operator', label:'Password', submit:'Enter', err:'Wrong password', foot:'Private workspace. Access by invitation.' },
    pl: { role:'AI-native revenue operator', label:'Hasło', submit:'Wejdź', err:'Nieprawidłowe hasło', foot:'Prywatny workspace. Dostęp na zaproszenie.' },
    it: { role:'AI-native revenue operator', label:'Password', submit:'Entra', err:'Password errata', foot:'Workspace privato. Accesso su invito.' },
  };
  function setLang(l) {
    var dict = I18N[l] || I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });
    document.documentElement.setAttribute('lang', l);
    document.querySelectorAll('.langbtn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === l);
    });
    try { localStorage.setItem('lang', l); } catch(e){}
  }
  document.querySelectorAll('.langbtn').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); });
  });
  var savedLang = (function(){ try{return localStorage.getItem('lang');}catch(e){return null;} })();
  if (savedLang && I18N[savedLang]) setLang(savedLang);

  // Login submit
  var form = document.getElementById('loginForm');
  var pwInput = document.getElementById('pw');
  var errEl = document.getElementById('err');
  var btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errEl.classList.remove('show');
    var password = (pwInput.value || '').trim();
    if (!password) { pwInput.focus(); return; }

    btn.disabled = true;
    var origBtnText = btn.textContent;
    btn.textContent = '…';

    try {
      var res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: password }),
        credentials: 'same-origin',
      });
      if (res.ok) {
        window.location.href = '/';
        return;
      }
      errEl.classList.add('show');
      pwInput.value = '';
      pwInput.focus();
    } catch (err) {
      errEl.textContent = 'Network error';
      errEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = origBtnText;
    }
  });
</script>

</body>
</html>
