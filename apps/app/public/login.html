<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wojciech Łuszczyński Sign in</title>
<meta name="robots" content="noindex,nofollow" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<script>
  (function(){
    try {
      var saved = localStorage.getItem('theme');
      var mode = saved ? saved : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', mode);
      document.documentElement.style.colorScheme = mode;
    } catch(e) { document.documentElement.setAttribute('data-theme','light'); }
  })();
</script>
<style>
  :root {
    --bg:#FFFFFF; --surface:#FFFFFF;
    --lime:#EBFF00; --lime-press:#d8ec00;
    --border:rgba(0,0,0,0.14); --border-strong:#1A1919;
    --text:#1A1919; --text-2:#5c5c5c; --text-3:#8a8a8a;
    --ink:#080d1a;
  }
  [data-theme="dark"] {
    --bg:#0A0A0B; --surface:#0A0A0B;
    --lime:#EBFF00; --lime-press:#d8ec00;
    --border:rgba(255,255,255,0.16); --border-strong:#f2f2f2;
    --text:#F2F2F2; --text-2:#9a9aa2; --text-3:#6a6a72;
    --ink:#080d1a;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Geist','Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    transition: background .15s, color .15s;
  }

  /* ---- top bar ---- */
  .topbar {
    display: flex; align-items: center; justify-content: flex-end;
    gap: 10px;
    padding: 20px 24px;
  }
  .icon-btn {
    width: 34px; height: 34px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid var(--border); background: none;
    color: var(--text-2); cursor: pointer;
    transition: color .12s, border-color .12s;
  }
  .icon-btn:hover { color: var(--text); border-color: var(--border-strong); }

  .langtoggle { display: inline-flex; border: 1px solid var(--border); }
  .langbtn {
    font-size: 12px; font-weight: 500; letter-spacing: .3px;
    padding: 7px 12px;
    background: none; border: none; color: var(--text-3); cursor: pointer;
    font-family: inherit; transition: color .12s, background .12s;
  }
  .langbtn + .langbtn { border-left: 1px solid var(--border); }
  .langbtn:hover { color: var(--text); }
  .langbtn.active { background: var(--lime); color: var(--ink); }

  /* ---- stage ---- */
  .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 8px 24px 48px; }
  .panel { width: 100%; max-width: 372px; }

  .mark { width: 46px; height: 46px; display: block; margin-bottom: 26px; }

  .name {
    font-size: 30px; font-weight: 400; line-height: 1.1;
    letter-spacing: -0.02em;
    margin: 0 0 8px;
  }
  .role {
    font-size: 14px; font-weight: 400; line-height: 1.5;
    color: var(--text-2);
    margin: 0 0 30px;
  }

  .form { display: flex; flex-direction: column; }
  .label {
    font-size: 12.5px; font-weight: 500; letter-spacing: .1px;
    color: var(--text-2);
    margin: 0 0 8px;
  }
  .input {
    width: 100%; height: 52px;
    padding: 0 15px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 0;
    color: var(--text);
    font-size: 15px; font-family: inherit;
    outline: none;
    transition: border-color .12s, box-shadow .12s;
  }
  .input::placeholder { color: var(--text-3); }
  .input:focus { border-color: var(--border-strong); box-shadow: inset 0 0 0 1px var(--border-strong); }

  .btn {
    width: 100%; height: 56px;
    margin-top: 14px;
    background: var(--lime); color: var(--ink);
    font-size: 15px; font-weight: 500; letter-spacing: .1px;
    border: 1px solid var(--lime); border-radius: 0;
    cursor: pointer; font-family: inherit;
    transition: background .12s, border-color .12s;
  }
  .btn:hover:not(:disabled) { background: var(--lime-press); border-color: var(--lime-press); }
  .btn:disabled { cursor: not-allowed; opacity: .55; }

  .err {
    min-height: 20px; margin-top: 12px;
    font-size: 12.5px; color: #d92d20; font-weight: 500;
    opacity: 0; transition: opacity .15s;
  }
  [data-theme="dark"] .err { color: #ff6b60; }
  .err.show { opacity: 1; }

  .foot {
    margin-top: 34px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    font-size: 12px; font-weight: 400; letter-spacing: .2px;
    color: var(--text-3);
  }

  @media (max-width: 460px) {
    .topbar { padding: 14px 16px; }
    .stage { padding: 4px 20px 40px; }
    .name { font-size: 26px; }
    .mark { margin-bottom: 22px; }
  }

  .icon-sun { display: none; }
  .icon-moon { display: block; }
  [data-theme="dark"] .icon-sun { display: block; }
  [data-theme="dark"] .icon-moon { display: none; }
</style>
</head>
<body>

<div class="topbar">
  <div class="langtoggle" role="group" aria-label="Language">
    <button class="langbtn" data-lang="pl" type="button">PL</button>
    <button class="langbtn active" data-lang="en" type="button">EN</button>
    <button class="langbtn" data-lang="it" type="button">IT</button>
  </div>
  <button class="icon-btn" id="themeBtn" aria-label="Toggle theme" type="button">
    <svg class="icon-moon" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    <svg class="icon-sun" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
  </button>
</div>

<div class="stage">
  <div class="panel">
    <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="wojciech.io">
      <rect width="32" height="32" rx="6" fill="#ebff00"/>
      <text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-weight="800" font-size="14" fill="#080d1a">.io</text>
    </svg>
    <h1 class="name">Wojciech Łuszczyński</h1>
    <p class="role" data-i18n="role">GTM Architect &amp; Growth Operator</p>

    <form class="form" id="loginForm" novalidate>
      <label class="label" for="pw" data-i18n="label">Password</label>
      <input class="input" id="pw" type="password" placeholder="••••••••" autocomplete="current-password" required autofocus />
      <button class="btn" id="submitBtn" type="submit" data-i18n="submit">Enter</button>
      <div class="err" id="err" role="alert" data-i18n="err">Wrong password</div>
    </form>

    <p class="foot" data-i18n="foot">Private workspace. Access by invitation.</p>
  </div>
</div>

<script>
  // Theme toggle
  document.getElementById('themeBtn').addEventListener('click', function() {
    var cur = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    document.documentElement.style.colorScheme = next;
    try { localStorage.setItem('theme', next); } catch(e){}
  });

  // i18n
  var I18N = {
    en: { role:'GTM Architect & Growth Operator', label:'Password', submit:'Enter', err:'Wrong password', foot:'Private workspace. Access by invitation.' },
    pl: { role:'GTM Architect & Growth Operator', label:'Hasło', submit:'Wejdź', err:'Nieprawidłowe hasło', foot:'Prywatny workspace. Dostęp na zaproszenie.' },
    it: { role:'GTM Architect & Growth Operator', label:'Password', submit:'Entra', err:'Password errata', foot:'Workspace privato. Accesso su invito.' },
  };
  function setLang(l) {
    var dict = I18N[l] || I18N.en;
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var key = el.getAttribute('data-i18n');
      if (dict[key]) el.textContent = dict[key];
    });
    document.documentElement.setAttribute('lang', l);
    document.querySelectorAll('.langbtn').forEach(function(b){
      b.classList.toggle('active', b.getAttribute('data-lang') === l);
    });
    try { localStorage.setItem('lang', l); } catch(e){}
  }
  document.querySelectorAll('.langbtn').forEach(function(b){
    b.addEventListener('click', function(){ setLang(b.getAttribute('data-lang')); });
  });
  var savedLang = (function(){ try{return localStorage.getItem('lang');}catch(e){return null;} })();
  if (savedLang && I18N[savedLang]) setLang(savedLang);

  // Login submit
  var form = document.getElementById('loginForm');
  var pwInput = document.getElementById('pw');
  var errEl = document.getElementById('err');
  var btn = document.getElementById('submitBtn');

  form.addEventListener('submit', async function(e) {
    e.preventDefault();
    errEl.classList.remove('show');
    var password = (pwInput.value || '').trim();
    if (!password) { pwInput.focus(); return; }

    btn.disabled = true;
    var origBtnText = btn.textContent;
    btn.textContent = '…';

    try {
      var res = await fetch('/api/auth', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ password: password }),
        credentials: 'same-origin',
      });
      if (res.ok) {
        window.location.href = '/';
        return;
      }
      errEl.classList.add('show');
      pwInput.value = '';
      pwInput.focus();
    } catch (err) {
      errEl.textContent = 'Network error';
      errEl.classList.add('show');
    } finally {
      btn.disabled = false;
      btn.textContent = origBtnText;
    }
  });
</script>

</body>
</html>
