# Source of truth for non-secret bindings for the growthhub Pages project.
# Secrets (PIPEDRIVE_API_TOKEN, GA4_SERVICE_ACCOUNT_JSON) live in CF dashboard.
name = "growthhub"
compatibility_date = "2026-05-20"
pages_build_output_dir = "./dist"

[[env.production.d1_databases]]
binding = "DB"
database_name = "growthhub-db"
database_id = "2f1a5091-e1ad-4403-bfd5-8ce93c9fc092"

# Nightly sync is triggered by the standalone Worker in apps/growthhub-cron/.
# CF Pages Functions don't support scheduled events; the Worker POSTs to /api/sync
# using a shared CRON_SECRET. Set CRON_SECRET (Secret) in both:
#   - CF Pages → growthhub → Settings → Environment Variables
#   - CF Workers → growthhub-cron → Settings → Variables
