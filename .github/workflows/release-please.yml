name: Release Please

# Sprint 0: manual only. Uncomment push trigger once you want automated
# CHANGELOG + version tags on every merge to main.
on:
  workflow_dispatch:
  # push:
  #   branches: ["main"]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          release-type: node
          token: ${{ secrets.GITHUB_TOKEN }}
