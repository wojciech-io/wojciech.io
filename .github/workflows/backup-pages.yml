name: Backup — Azure Static Web Apps

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'  # poniedziałek 3:00 UTC

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Without the token the Azure action fails after a full build, which made
      # every weekly run red from July to September 2026 while no Azure copy
      # existed at all. Skip with a visible warning until the token is set.
      - name: Check the Azure token is configured
        id: token
        env:
          AZURE_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          if [ -z "$AZURE_TOKEN" ]; then
            echo "::warning::AZURE_STATIC_WEB_APPS_API_TOKEN is not set, so there is no Azure copy to refresh. Backup skipped."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.token.outputs.configured == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.token.outputs.configured == 'true'
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: steps.token.outputs.configured == 'true'
      - run: npm run build
        if: steps.token.outputs.configured == 'true'

      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        if: steps.token.outputs.configured == 'true'
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: /
          output_location: dist
          skip_app_build: true
