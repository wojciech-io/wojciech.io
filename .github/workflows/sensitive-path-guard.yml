name: Sensitive path guard

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  guard:
    name: Block internal tooling dirs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for blocked paths in PR diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          BLOCKED=".agent-reports/ .agent-state/ .claude/ .codex-tasks/ archive/insights-legacy/ templates/ prompts/ HANDOFF.md"
          # docs/ is gitignored except for public-safe reference and audit files.
          # Everything else under docs/ is blocked.
          is_allowed_doc() {
            case "$1" in
              docs/10-tone-of-voice.md|docs/design-system.md|docs/lighthouse-baseline-*.md|docs/security-audit-*.md|docs/insight-cover-generation-brief.md|docs/*-image-prompts.md)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          CHANGED=$(git diff --name-status "$BASE" "$HEAD" | awk '$1 ~ /^R/ { print $3; next } $1 != "D" { print $2 }')
          FOUND=""

          # Check general blocked prefixes
          for path in $BLOCKED; do
            if echo "$CHANGED" | grep -q "^${path}"; then
              FOUND="${FOUND} ${path}"
            fi
          done

          # Check docs/ separately: flag any docs/ file that is not in the allowlist
          DOCS_CHANGED=$(echo "$CHANGED" | grep "^docs/" || true)
          if [ -n "$DOCS_CHANGED" ]; then
            while IFS= read -r doc_path; do
              if ! is_allowed_doc "$doc_path"; then
                FOUND="${FOUND} ${doc_path}"
              fi
            done <<< "$DOCS_CHANGED"
          fi

          if [ -n "$FOUND" ]; then
            echo "::error::Blocked internal dirs in this PR:${FOUND}"
            echo ""
            echo "These paths contain internal planning, generated reports, or unpublished drafts"
            echo "and must never enter the public repository."
            echo "Remove them and amend the commit."
            exit 1
          fi

          echo "No blocked paths found. PR is clean."
