name: Deploy

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

# Never cancel a running deploy — let it finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-site:
    name: Deploy wojciech.io
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wojciech.io
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      - name: Wrangler deploy
        run: npx wrangler pages deploy dist --project-name=wojciech-io --branch=main --commit-message=deploy-wojciech-io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 39783e1749680bed4039662ab696c3b1

  deploy-app:
    name: Deploy app.wojciech.io
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.wojciech.io
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build:app

      - name: Wrangler deploy
        run: npx wrangler pages deploy apps/app/dist --project-name=app-wojciech-io --branch=main --commit-message=deploy-app-wojciech-io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 39783e1749680bed4039662ab696c3b1

  deploy-subscribe:
    name: Deploy subscribe.wojciech.io
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://subscribe.wojciech.io
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build:subscribe

      - name: Wrangler deploy
        run: npx wrangler pages deploy apps/subscribe/dist --project-name=subscribe-wojciech-io --branch=main --commit-message=deploy-subscribe-wojciech-io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 39783e1749680bed4039662ab696c3b1

  deploy-notch:
    name: Deploy notch.wojciech.io
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://notch.wojciech.io
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build:notch

      - name: Wrangler deploy
        run: npx wrangler pages deploy apps/notch/dist --project-name=notch-wojciech-io --branch=main --commit-message=deploy-notch-wojciech-io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 39783e1749680bed4039662ab696c3b1
