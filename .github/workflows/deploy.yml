name: Deploy

on:
  workflow_dispatch: {}
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

# Never cancel a running deploy — let it finish.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy-site:
    name: Deploy wojciech.io
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://wojciech.io
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build
        env:
          # PUBLIC_ vars are inlined at build time; production is built here in
          # CI (not by Cloudflare), so the key must live as a GitHub secret.
          # Public PostHog project key, safe to expose in client JS.
          PUBLIC_POSTHOG_KEY: ${{ secrets.PUBLIC_POSTHOG_KEY }}

      - name: Wrangler deploy
        run: npx wrangler pages deploy dist --project-name=wojciech-io --branch=main --commit-message=deploy-wojciech-io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 39783e1749680bed4039662ab696c3b1

  deploy-app:
    name: Deploy app.wojciech.io
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.wojciech.io
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build:app

      - name: Wrangler deploy
        run: npx wrangler pages deploy apps/app/dist --project-name=app-wojciech-io --branch=main --commit-message=deploy-app-wojciech-io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 39783e1749680bed4039662ab696c3b1

  deploy-subscribe:
    name: Deploy subscribe.wojciech.io
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://subscribe.wojciech.io
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build:subscribe

      # working-directory matters: wrangler bundles the functions/ dir found in
      # the CWD. From the repo root it silently shipped the MAIN site's
      # functions to this project — whose /api/subscribe proxies to
      # subscribe.wojciech.io, i.e. itself, an infinite loop that rate-limited
      # every real signup. Deploying from apps/subscribe ships its own
      # double-opt-in functions (subscribe.ts + confirm.ts).
      - name: Wrangler deploy
        working-directory: apps/subscribe
        run: npx wrangler pages deploy dist --project-name=subscribe-wojciech-io --branch=main --commit-message=deploy-subscribe-wojciech-io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 39783e1749680bed4039662ab696c3b1

  deploy-academy:
    name: Deploy academy.wojciech.io
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://academy.wojciech.io
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build:academy

      # Same CWD-functions fix as subscribe: academy has its own functions
      # (_middleware.ts + api/) that the root-CWD deploy was silently replacing
      # with the main site's set.
      - name: Wrangler deploy
        working-directory: apps/academy
        run: npx wrangler pages deploy dist --project-name=akademia-wojciech-io --branch=main --commit-message=deploy-academy-wojciech-io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 39783e1749680bed4039662ab696c3b1

  deploy-notch:
    name: Deploy notch.wojciech.io
    if: github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://notch.wojciech.io
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build:notch

      - name: Wrangler deploy
        run: npx wrangler pages deploy apps/notch/dist --project-name=notch-wojciech-io --branch=main --commit-message=deploy-notch-wojciech-io
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 39783e1749680bed4039662ab696c3b1
