name: Security

# Runs on manual dispatch, every PR to main, and a weekly Sunday cron.
on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 22 * * 0"   # Sun 22:00 UTC — weekly Security Auditor scan

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          GITLEAKS_VERSION=$(curl -sI https://github.com/gitleaks/gitleaks/releases/latest | grep -i location | sed 's|.*/v||;s/[^0-9.].*//')
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz -C /usr/local/bin gitleaks
      - name: Run gitleaks
        run: gitleaks detect --source . --verbose --redact

  deps:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: npm audit (fail on high/critical in runtime deps)
        # Fails on any high/critical advisory in a runtime dependency, while
        # waiving a documented allowlist of build/dev-only tooling (vite, esbuild,
        # ws/miniflare/wrangler, the CF adapter) that never ships to the Workers
        # runtime and in several cases has no non-breaking fix. See the script.
        run: node scripts/security-audit.mjs

  sast:
    name: SAST (semgrep)
    runs-on: ubuntu-latest
    container:
      image: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v7
      - run: semgrep ci --config auto
        env:
          SEMGREP_RULES: "p/default p/javascript p/typescript"

  headers:
    name: Security headers
    runs-on: ubuntu-latest
    # No checkout needed — pure HTTP probing.
    steps:
      - name: Verify required headers per subdomain
        run: |
          set -u
          REQUIRED="content-security-policy strict-transport-security x-frame-options x-content-type-options referrer-policy permissions-policy"
          FAILED=0

          check_url() {
            local label="$1"
            local url="$2"
            local mode="$3"   # blocking | warning

            echo "::group::$label ($url, mode=$mode)"
            headers=$(curl -sIL --max-time 15 -A "wojciech-io-headers-check/1.0" "$url" | tr '[:upper:]' '[:lower:]')
            missing=""
            for h in $REQUIRED; do
              if ! echo "$headers" | grep -q "^$h:"; then
                missing="$missing $h"
              fi
            done

            if [ -n "$missing" ]; then
              if [ "$mode" = "blocking" ]; then
                echo "::error::$label missing required headers:$missing"
                FAILED=1
              else
                echo "::warning::$label missing headers:$missing (non-blocking security header gap)"
              fi
            else
              echo "$label ✓ all required headers present"
            fi
            echo "::endgroup::"
          }

          # Public surfaces — strict blocking.
          check_url "wojciech.io"           "https://wojciech.io/"           blocking
          check_url "academy.wojciech.io"   "https://academy.wojciech.io/"   blocking
          check_url "notch.wojciech.io"     "https://notch.wojciech.io/"     blocking
          check_url "subscribe.wojciech.io" "https://subscribe.wojciech.io/" blocking

          # Gated apps — probe their login surface (gate response itself is bare).
          check_url "gh.wojciech.io/login"  "https://gh.wojciech.io/login"   blocking

          check_url "app.wojciech.io/login" "https://app.wojciech.io/login"  blocking

          if [ "$FAILED" -ne 0 ]; then
            echo "::error::One or more subdomains missing required security headers"
            exit 1
          fi
          echo "All blocking-mode subdomains green."
