name: Daily digest

# Sprint 0: MANUAL ONLY. Confirm the mail looks right via workflow_dispatch,
# THEN uncomment the 8:00 cron (deliberate enable, Sprint 0 day 5).
on:
  workflow_dispatch:
  # schedule:
  #   - cron: "0 6 * * 1-5"   # 08:00 Europe/Warsaw (CEST=UTC+2), Mon–Fri

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  DIGEST_TO: w.luszczynski@gmail.com

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build digest body
        id: build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## Standup — $(date -u +%Y-%m-%d)"
            echo ""
            echo "### 🔴 Wymaga decyzji"
            gh pr list --state open --label "needs-decision" \
              --json number,title,url \
              --jq '.[] | "- PR #\(.number) \(.title) — \(.url)"' || echo "_(brak)_"
            echo ""
            echo "### 🟡 Open PRs"
            gh pr list --state open --json number,title,url \
              --jq '.[] | "- #\(.number) \(.title) — \(.url)"' || echo "_(brak)_"
            echo ""
            echo "### 🟢 Merged (24h)"
            gh pr list --state merged --search "merged:>=$(date -u -d '1 day ago' +%Y-%m-%d 2>/dev/null || date -u -v-1d +%Y-%m-%d)" \
              --json number,title --jq '.[] | "- #\(.number) \(.title)"' || echo "_(brak)_"
            echo ""
            echo "### Agent health"
            for s in .agent-state/*/state.md; do
              echo "- $s:"; grep -E 'Last run|Health' "$s" | sed 's/^/    /'
            done
            echo ""
            echo "→ dev.wojciech.io (Sprint 1)"
          } > digest.md
          cat digest.md

      - name: Send mail
        if: ${{ env.SMTP_HOST != '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USER }}
          password: ${{ secrets.SMTP_PASS }}
          subject: "[wojciech.io] Daily digest — ${{ github.run_started_at }}"
          to: ${{ env.DIGEST_TO }}
          from: "wojciech.io agents <${{ secrets.SMTP_USER }}>"
          html_body: file://digest.md
          convert_markdown: true

      - name: No SMTP configured
        if: ${{ env.SMTP_HOST == '' }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
        run: echo "SMTP_* secrets not set — digest built but not mailed. Set secrets to enable mail."
