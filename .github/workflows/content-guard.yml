name: Content guard

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Weekly scan every Monday 06:00 UTC — catches drift that slips through PR checks
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-quality:
    name: Privacy + quality scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run content guard (PR diff)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/content-guard.sh --diff "$BASE" "$HEAD"

      - name: Run content guard (full scan)
        if: github.event_name != 'pull_request'
        run: bash scripts/content-guard.sh
