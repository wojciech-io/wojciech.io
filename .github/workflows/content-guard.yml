name: Content guard

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]
  schedule:
    # Weekly scan every Monday 06:00 UTC — catches drift that slips through PR checks
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  privacy-quality:
    name: Privacy + quality scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Run content guard (PR diff)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/content-guard.sh --diff "$BASE" "$HEAD"

      - name: Run content guard (full scan)
        if: github.event_name != 'pull_request'
        run: bash scripts/content-guard.sh

  # Separate job on purpose. The scan above is a gate and must stay red when it
  # trips; this one is a report and must never block a merge, so it lives in its
  # own check that always succeeds. Keep it out of the required-checks list.
  anti-slop:
    name: Anti-slop lint (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Install Vale
        env:
          VALE_VERSION: 3.17.0
          VALE_SHA256: a903f1f60c3293fac643e0137f599a462881cc691ee19d6120dcfc786f1be86d
        run: |
          set -euo pipefail
          url="https://github.com/errata-ai/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz"
          curl -sSfL -o vale.tar.gz "$url"
          # Pinned version plus checksum: the styles package this tool then
          # downloads is also pinned, so two runs on the same content are
          # comparable and a swapped release cannot slip in unnoticed.
          echo "${VALE_SHA256}  vale.tar.gz" | sha256sum -c -
          tar -xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale
          vale --version

      - name: Sync styles
        run: vale sync

      - name: Report (PR diff)
        if: github.event_name == 'pull_request'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/anti-slop.sh --diff "$BASE" "$HEAD" >> "$GITHUB_STEP_SUMMARY"

      - name: Report (full scan)
        if: github.event_name != 'pull_request'
        run: bash scripts/anti-slop.sh >> "$GITHUB_STEP_SUMMARY"

  # Weekly only. This reads other people's live pages, so it has no business
  # running on every push, and a third party editing their own docs is not a
  # reason to fail anybody's build. It opens an issue instead.
  source-decay:
    name: Source decay (weekly)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Re-read declared sources
        id: check
        run: |
          set -euo pipefail
          node scripts/check-sources.mjs > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          # Only escalate when a pinned quote is actually gone. "Unreachable"
          # alone is too noisy to open an issue over: a bot block and a deleted
          # page look identical from a runner.
          if grep -q '\*\*drifted\*\*' report.md; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Open an issue if a quote has gone
        if: steps.check.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # No --label: the repo has no matching label, and gh fails the step
          # rather than creating the issue without one.
          gh issue create \
            --repo "${{ github.repository }}" \
            --title "Source drift: a quoted fragment is no longer at its source" \
            --body-file report.md
