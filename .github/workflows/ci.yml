name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # The job has been called "Build & type-check" since it was written and
      # never type-checked anything.
      #
      # Scope, measured rather than assumed: this covers .ts and .astro. It does
      # NOT catch a bad option in astro.config.mjs, which is how the Sentry
      # sourceMapsUploadOptions regression got in. I reintroduced that bug and
      # this step still exited 0. Checking .mjs config needs checkJs and is a
      # separate change.
      #
      # Two projects, because the Workers globals shadow Node's Buffer: the
      # site and its build scripts are Node, the Pages Functions and the
      # growthhub apps are Workers. Runs after the build, which is what
      # generates .astro/types.d.ts.
      - name: Type-check
        run: npm run type-check

      # Static checks on the built output: canonical, OG/Twitter, hreflang,
      # lang attributes, favicons, manifest, robots, sitemap. These used to run
      # in Playwright, which meant booting two browsers to read markup.
      # They live here because this is the job that has dist/.
      - name: Built-output checks
        run: npm run test:built

      # Uploaded on every ref, not just main: the E2E job consumes this instead
      # of building the site a second time.
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run test:unit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Browser binaries are the bulk of this job's runtime and they change only
      # when the Playwright version does, so they are cached on that version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Binaries only. Their apt libraries come from the step below, which runs
      # whether or not this cache hit.
      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium webkit

      # The browser cache brings the binaries but not the apt libraries they
      # link against. Dropping the install was tried and failed loudly: WebKit
      # could not start because ubuntu-latest does not ship libevent-2.1.so.7.
      # Chromium was fine, so the cost is WebKit's alone, and mobile-safari
      # coverage is worth keeping on a site whose iOS behaviour has bitten before.
      #
      # That cost is 186 packages, 139 MB, fetched from whichever Ubuntu mirror
      # the runner's cloud assigns. The image fails over to archive.ubuntu.com
      # only when a mirror goes silent for 15 s. On 18.11.2026 the EC2 mirror
      # did not go silent, it trickled at 60 to 130 KB/s, and two runs in a row
      # sat in this step until the 10-minute job timeout cancelled them, which
      # held every deploy until someone re-ran the job. Hence two guards: the
      # .deb files are cached, so apt mostly reads them from disk, and the
      # install is bounded, with one retry that skips the regional mirror.
      #
      # Keyed on the image release date, which AWS and Azure runners share
      # (their full ImageVersion differs), so a new image starts from the
      # previous one's packages and apt fetches only what changed.
      - name: Resolve runner image
        id: image
        run: |
          echo "os=${ImageOS:-unknown}" >> "$GITHUB_OUTPUT"
          echo "release=${ImageVersion%%.*}" >> "$GITHUB_OUTPUT"

      - name: Cache WebKit system packages
        id: apt-cache
        uses: actions/cache@3edfce9056124e459a23f683a21433670d47daca # v4
        with:
          path: ~/.cache/apt-debs
          key: apt-webkit-${{ steps.image.outputs.os }}-${{ steps.image.outputs.release }}-pw${{ steps.pw.outputs.version }}
          restore-keys: |
            apt-webkit-${{ steps.image.outputs.os }}-${{ steps.image.outputs.release }}-
            apt-webkit-${{ steps.image.outputs.os }}-

      - name: Install browser system dependencies
        timeout-minutes: 6
        env:
          APT_CACHE_HIT: ${{ steps.apt-cache.outputs.cache-hit }}
        run: |
          debs="$HOME/.cache/apt-debs"
          mkdir -p "$debs"
          echo 'APT::Keep-Downloaded-Packages "true";' | sudo tee /etc/apt/apt.conf.d/zz-keep-debs > /dev/null
          # apt checks each file against the index and re-downloads any that
          # no longer match, so a stale cache costs time, never correctness.
          if compgen -G "$debs/*.deb" > /dev/null; then
            sudo cp "$debs"/*.deb /var/cache/apt/archives/
            echo "Restored $(ls "$debs"/*.deb | wc -l) cached packages"
          fi

          # Run as root so timeout can kill apt-get itself. As the runner user
          # it could only signal the playwright wrapper above sudo.
          install_deps() {
            sudo env "PATH=$PATH" DEBIAN_FRONTEND=noninteractive \
              timeout --kill-after=10 "$1" ./node_modules/.bin/playwright install-deps webkit
          }

          if ! install_deps 3; then
            echo "::warning::WebKit system packages were not installed within 120 s. Retrying once without the regional mirror."
            sudo dpkg --configure -a
            if [ -f /etc/apt/apt-mirrors.txt ]; then
              cat /etc/apt/apt-mirrors.txt
              sudo sed -i '/priority:1$/d' /etc/apt/apt-mirrors.txt
            fi
            install_deps 180
          fi

          # Keep this run's downloads for the next one. autoclean drops versions
          # the index no longer lists, so the cache does not grow across images.
          if [ "$APT_CACHE_HIT" != "true" ]; then
            sudo apt-get autoclean -qq
            rm -f "$debs"/*.deb
            if compgen -G "/var/cache/apt/archives/*.deb" > /dev/null; then
              cp /var/cache/apt/archives/*.deb "$debs"/
            fi
            du -sh "$debs"
          fi

      # This job already waits on build, so rebuilding the site here was pure
      # duplicated work. Take that job's output instead; PW_SKIP_BUILD tells the
      # Playwright webServer to serve dist/ rather than run a build first.
      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Runs the whole tests/e2e directory. This used to be a hand-maintained
      # list of spec files, which silently drifted: three specs sat in the
      # directory without ever running, and a green check covered 8 of 11.
      # Adding a spec to tests/e2e is now enough to get it verified.
      # visual.spec.ts is excluded via testIgnore in playwright.config.ts
      # (macOS baselines do not survive a Linux runner).
      # The static markup assertions that used to run here (seo, hreflang,
      # locale-html-lang, meta-assets) live in `npm run test:built`.
      - name: Run browser-dependent E2E
        run: npx playwright test tests/e2e
        env:
          CI: "true"
          PW_SKIP_BUILD: "1"

      # The rendered pages themselves, so a reviewer can look at a pull request
      # instead of trusting its description. Captured by screenshots.spec.ts,
      # which asserts nothing and therefore cannot fail the build.
      - name: Upload page screenshots
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: page-screenshots
          path: page-screenshots/
          if-no-files-found: warn

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
