name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # Static checks on the built output: canonical, OG/Twitter, hreflang,
      # lang attributes, favicons, manifest, robots, sitemap. These used to run
      # in Playwright, which meant booting two browsers to read markup.
      # They live here because this is the job that has dist/.
      - name: Built-output checks
        run: npm run test:built

      # Uploaded on every ref, not just main: the E2E job consumes this instead
      # of building the site a second time.
      - name: Upload dist artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run test:unit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Browser binaries are the bulk of this job's runtime and they change only
      # when the Playwright version does, so they are cached on that version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # A restored cache brings the binaries but not the apt libraries they link
      # against. Dropping this step was tried and failed loudly: WebKit could not
      # start because ubuntu-latest does not ship libevent-2.1.so.7. Chromium was
      # fine, so the cost is WebKit's alone, and mobile-safari coverage is worth
      # keeping on a site whose iOS behaviour has bitten before.
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit

      # This job already waits on build, so rebuilding the site here was pure
      # duplicated work. Take that job's output instead; PW_SKIP_BUILD tells the
      # Playwright webServer to serve dist/ rather than run a build first.
      - name: Download the built site
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # Runs the whole tests/e2e directory. This used to be a hand-maintained
      # list of spec files, which silently drifted: three specs sat in the
      # directory without ever running, and a green check covered 8 of 11.
      # Adding a spec to tests/e2e is now enough to get it verified.
      # visual.spec.ts is excluded via testIgnore in playwright.config.ts
      # (macOS baselines do not survive a Linux runner).
      # The static markup assertions that used to run here (seo, hreflang,
      # locale-html-lang, meta-assets) live in `npm run test:built`.
      - name: Run browser-dependent E2E
        run: npx playwright test tests/e2e
        env:
          CI: "true"
          PW_SKIP_BUILD: "1"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
