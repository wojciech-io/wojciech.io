name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run build

      # Static checks on the built output: canonical, OG/Twitter, hreflang,
      # lang attributes, favicons, manifest, robots, sitemap. These used to run
      # in Playwright, which meant booting two browsers to read markup.
      # They live here because this is the job that has dist/.
      - name: Built-output checks
        run: npm run test:built

      - name: Upload dist artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  unit:
    name: Unit tests (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - run: npm run test:unit

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      # Browser binaries are the bulk of this job's runtime and they change only
      # when the Playwright version does, so they are cached on that version.
      - name: Resolve Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@640a1c2554105b57832a23eea0b4672fc7a790d5 # v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright browsers
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium webkit

      # A cache hit restores the binaries but not the apt libraries they link
      # against, so the system deps are installed either way.
      - name: Install browser system dependencies
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium webkit

      # Runs the whole tests/e2e directory. This used to be a hand-maintained
      # list of spec files, which silently drifted: three specs sat in the
      # directory without ever running, and a green check covered 8 of 11.
      # Adding a spec to tests/e2e is now enough to get it verified.
      # visual.spec.ts is excluded via testIgnore in playwright.config.ts
      # (macOS baselines do not survive a Linux runner).
      # The static markup assertions that used to run here (seo, hreflang,
      # locale-html-lang, meta-assets) live in `npm run test:built`.
      - name: Run browser-dependent E2E
        run: npx playwright test tests/e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
