name: Smoke (prod)

# Triggers:
#   - workflow_dispatch: manual run with optional base_url override
#   - repository_dispatch (type: betterstack-incident): fired by BetterStack
#     webhook on incident start for the wojciech.io monitor.
#   - schedule: daily at 07:00 UTC as a passive canary
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "Prod base URL to smoke"
        required: false
        default: "https://wojciech.io"
  repository_dispatch:
    types: [betterstack-incident]
  schedule:
    - cron: "0 7 * * *"

permissions:
  contents: read
  issues: write   # to open a severity:critical Issue on failure

jobs:
  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: "npm"
      - run: npm ci
      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run smoke against ${{ github.event.inputs.base_url || 'https://wojciech.io' }}
        id: smoke
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://wojciech.io' }}
          CI: "true"
        run: npx playwright test smoke --project=chromium-desktop

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-prod-report
          path: playwright-report/
          retention-days: 14

      - name: Open URGENT Issue on smoke failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE_URL: ${{ github.event.inputs.base_url || 'https://wojciech.io' }}
        run: |
          gh issue create \
            --title "[URGENT] smoke-prod failed against $BASE_URL" \
            --label "severity:critical,agent:test" \
            --body "Post-deploy smoke failed. See workflow run for the Playwright report.

          Trigger: ${{ github.event_name }}
          Suggested next step: \`gh workflow run rollback.yml\`"
