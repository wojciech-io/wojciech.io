name: CodeQL

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "0 6 * * 1"  # Mon 06:00 UTC — weekly

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.3
        with:
          languages: javascript-typescript
          queries: security-and-quality
          config: |
            paths-ignore:
              # Build-time CLI scripts: no untrusted input, no deploy surface.
              # Translator/glossary regexes trip non-literal-regexp + incomplete-sanitization
              # rules as false positives.
              - scripts/i18n/**
              - tests/**

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.3
        with:
          category: "/language:javascript-typescript"
