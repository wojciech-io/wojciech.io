name: Lighthouse CI

# Sprint 1 Tier 5d — Test Engineer performance baseline.
# Runs Lighthouse against production URLs and uploads HTML reports as artifacts.
# Starts in warning-only mode (no merge gating) — tighten budgets after baseline stabilizes.
#
# Triggers:
# - workflow_dispatch (manual)
# - weekly cron (Mon 06:00 UTC, before daily digest at 08:00 so results show up)
#
# Future (Sprint 2+): add on: pull_request once preview-URL resolution is wired in.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  lighthouse:
    name: Lighthouse against prod
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run Lighthouse
        uses: treosh/lighthouse-ci-action@3e7e23fb74242897f95c0ba9cabad3d0227b9b18 # v12
        with:
          urls: |
            https://wojciech.io/
            https://wojciech.io/about/
            https://wojciech.io/work/
            https://wojciech.io/ai-systems/
            https://wojciech.io/insights/
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: false

      # Scores lived only inside the uploaded artifact, so a green run said
      # nothing about whether the numbers moved. Print them on the run itself.
      - name: Summarise scores
        if: always()
        run: |
          node -e '
            const fs = require("fs");
            const dir = ".lighthouseci";
            if (!fs.existsSync(dir)) { console.log("no results"); process.exit(0); }
            const rows = fs.readdirSync(dir).filter(f => f.startsWith("lhr-") && f.endsWith(".json"))
              .map(f => JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")))
              .map(r => {
                const s = k => Math.round((r.categories[k]?.score ?? 0) * 100);
                const url = (r.finalDisplayedUrl || r.finalUrl || "").replace("https://wojciech.io", "") || "/";
                return `| ${url} | ${s("performance")} | ${s("accessibility")} | ${s("best-practices")} | ${s("seo")} |`;
              });
            const out = ["| page | perf | a11y | best | seo |", "|---|---|---|---|---|", ...rows].join("\n");
            console.log(out);
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, out + "\n");
          '
