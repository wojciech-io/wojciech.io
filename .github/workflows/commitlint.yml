name: Commitlint

# Sprint 1 — Release Manager guard:
# Enforces conventional commits on every PR so release-please can produce
# accurate CHANGELOG + correct semver bumps.
#
# Checks:
# - PR title (must match conventional-commit format)
# - every commit message in the PR
#
# Failures here block merge once branch protection is on (Sprint 2).
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Validate conventional commits
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci

      - name: Lint PR title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | npx commitlint

      - name: Lint commits in PR
        if: github.event_name == 'pull_request'
        run: |
          npx commitlint \
            --from ${{ github.event.pull_request.base.sha }} \
            --to ${{ github.event.pull_request.head.sha }} \
            --verbose

      - name: Lint last commit on push to main
        if: github.event_name == 'push'
        run: npx commitlint --from HEAD~1 --to HEAD --verbose
