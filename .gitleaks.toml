# Gitleaks config for wojciech.io. Extends the default ruleset.
[extend]
useDefault = true

# Cloudflare Web Analytics beacon token is PUBLIC by design — ships in the
# client-side beacon on every page load. PUBLIC_ prefix is Astro's convention
# for client-exposed vars. Not a secret; no rotation needed.
#
# Allowlist by SECRET VALUE (not line) — gitleaks `regexes` match the detected
# secret, not the full line. Both regex AND path AND commit must match.
# Triaged by security-auditor, see:
#   - .agent-reports/2026-05-22-security-auditor.md
#   - .agent-reports/2026-05-22-security-auditor-triage-002.md
[[allowlists]]
description = "PUBLIC_CF_BEACON_TOKEN — public-by-design Cloudflare Analytics beacon"
regexTarget = "line"
regexes = ['''PUBLIC_CF_BEACON_TOKEN\s*=\s*"[0-9a-f]{32}"''']
paths = ['''terraform/pages\.tf''']
