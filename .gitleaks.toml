# Gitleaks config for wojciech.io. Extends the default ruleset.
[extend]
useDefault = true

# Cloudflare Web Analytics beacon token is PUBLIC by design — ships in the
# client-side beacon on every page load. PUBLIC_ prefix is Astro's convention
# for client-exposed vars. Not a secret; no rotation needed.
#
# Earlier attempts used `regexes` (default target = secret, not line) and
# `regexTarget = "line"` — both failed on full-history scans, because the
# detected secret value (just the 32 hex chars) didn't match the line-anchored
# pattern, and the previous PR-mode runs only scanned diffs (so allowlist was
# never actually exercised).
#
# Surgical fix: allowlist the EXACT commit where the token was introduced.
# The value cannot change without rotation; if we rotate, this entry expires
# naturally (new finding in new commit, triage anew).
# Triaged by security-auditor, see:
#   - .agent-reports/2026-05-22-security-auditor.md
#   - .agent-reports/2026-05-22-security-auditor-triage-002.md
[[allowlists]]
description = "PUBLIC_CF_BEACON_TOKEN — public-by-design Cloudflare Analytics beacon (introduced in a4a831b)"
commits = ["a4a831b69168f633b5640d4f8d47f40ac4ad7b28"]
paths = ['''terraform/pages\.tf''']

[[allowlists]]
description = "Mixpanel project token — public-by-design, ships in every client bundle (introduced in a7aef16)"
commits = ["a7aef16cf47cbc5d861ec6e14d6a7e7598e7bf84"]
paths = ['''src/utils/mixpanel\.ts''']

# AnnouncementBar STORAGE_KEY is a localStorage dismissal key, bumped to a new
# value each time a new article is announced so the strip re-shows. It is not a
# secret, but a value like 'wio-anno-gpt56-claude5' trips generic-api-key on
# entropy. Matched by the secret value's stable 'wio-anno-' prefix, so this
# survives future bumps and never blindfolds the scanner to the rest of the file.
[[allowlists]]
description = "AnnouncementBar STORAGE_KEY — public localStorage key, not a secret; entropy trips generic-api-key"
regexes = ['''wio-anno-[a-z0-9-]+''']

[[allowlists]]
description = "content-guard.sh uses PEM header strings as detection-pattern literals, not actual keys. Allowlist the two commits where this file was introduced and patched."
commits = [
  "72b3639d7d535faaf37c021269724d5b41b0025f",
  "85aa4c77c168f538869526ab484d7da20680a15c",
]
paths = ['''scripts/content-guard\.sh''']
